# Render.com Blueprint — GitHub 저장소를 연결하면 이 파일대로 자동 배포됩니다.
# https://render.com > New > Blueprint > 이 저장소 선택
services:
  - type: web
    name: banjjaktalk
    runtime: node
    plan: free
    branch: claude/ai-chat-kids-service-seznwa
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # 배포 후 Render 대시보드에서 실제 키 값을 입력하세요 (sync:false = 값 비공개)
      - key: ANTHROPIC_API_KEY
        sync: false
      # 요청 제한 (선택) — 필요 시 값 조정
      - key: RL_PER_MIN
        value: "15"
      - key: RL_PER_DAY
        value: "200"
      - key: RL_GLOBAL_PER_DAY
        value: "3000"
      # (선택) 서버 음성 인식 — 값이 있으면 브라우저 미지원 기기에서도 받아쓰기 작동
      # OpenAI Whisper 호환. 미설정 시 "준비 중"으로 안전 비활성.
      - key: STT_API_KEY
        sync: false
      # (선택) 그림 만들기 — 이미지 생성 API 키. OpenAI Images 호환.
      # 미설정 시 "준비 중". 프롬프트는 항상 서버에서 안전 분류 후 생성.
      - key: IMAGE_API_KEY
        sync: false
