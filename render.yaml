# Render.com Blueprint ("Childhood AI")
#
# ⚠️ 이 파일은 지금 살아 있는 서비스를 관리하지 않는다 (2026-10-22 대시보드에서 확인).
#    이 Blueprint가 관리하는 서비스는 중지(Suspended)된 `banjjaktalk` 하나뿐이고,
#    실제로 서비스 중인 `childhood`(주소 banjjaktalk.onrender.com)는 대시보드에서 직접 관리된다.
#    따라서 아래 환경변수 값과 설정은 `childhood`에 적용되지 않는다. 값을 바꾸려면 Render 대시보드의
#    childhood 서비스 > Environment 에서 직접 바꾼다.
#    `name`을 바꾸거나 새 서비스 이름을 쓰면 동기화 때 서비스가 새로 생기니 바꾸지 않는다.
# https://render.com > New > Blueprint > 이 저장소 선택
services:
  - type: web
    # Render는 이름으로 블루프린트를 매칭한다. 이 이름은 Blueprint가 관리하는 서비스(중지된
    # banjjaktalk)의 이름이다. 바꾸면 Sync 때 서비스가 새로 생긴다.
    name: banjjaktalk
    runtime: node
    plan: free
    branch: main
    # 빌드에 필요한 패키지는 모두 dependencies에 있다. devDependencies에는
    # 테스트용 playwright가 있어 배포 때 브라우저를 내려받지 않도록 제외한다.
    buildCommand: npm install --omit=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # 배포 후 Render 대시보드에서 실제 키 값을 입력하세요 (sync:false = 값 비공개)
      - key: ANTHROPIC_API_KEY
        sync: false
      # 요청 제한 (선택) — 필요 시 값 조정
      - key: RL_PER_MIN
        value: "15"
      - key: RL_PER_DAY
        value: "200"
      # 전체(모든 사용자 합계) 하루 메시지 상한. 테스트 기간 값(300). 정식 서비스 때 올린다.
      # 비용 감각: 지금 모델(Opus 4.8)은 메시지 1건에 대략 $0.02(추정)라서 300건/일이면 하루 약 $6이다.
      # 월 사용 한도(Anthropic 콘솔)가 실제 안전장치이고, 이 값은 폭주를 막는 천장이다.
      - key: RL_GLOBAL_PER_DAY
        value: "300"
      #
      # (선택 기능) 그림 만들기 / 서버 음성 인식은 기본적으로 "준비 중"으로
      # 비활성 상태이며 별도 설정이 필요 없습니다. 나중에 켜고 싶으면 Render
      # 대시보드 > 서비스 > Environment 에서 아래 키를 "직접 추가"하세요.
      # (Blueprint에는 넣지 않아 배포 시 입력을 요구하지 않습니다.)
      #   IMAGE_API_KEY = 이미지 생성 API 키 (OpenAI Images 호환) → 그림 만들기 켜짐
      #   STT_API_KEY   = 음성 인식 API 키 (OpenAI Whisper 호환) → 서버 받아쓰기 켜짐
      #   FEEDBACK_URL  = 의견 받을 주소 (구글 폼 https://... 또는 mailto:...) → 부모 화면에
      #                   "의견 보내기" 링크가 나타남. 비우면 링크가 보이지 않음.
      #   RL_TZ         = 요청 제한의 하루 기준 시간대 (기본 Asia/Seoul)
