name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  logic:
    name: 로직 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: 배포와 동일 조건 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # render.yaml의 buildCommand와 같은 조건. 빌드에 필요한 패키지가
      # devDependencies로 새어 들어가면 여기서 먼저 깨진다.
      - run: npm install --omit=dev
        env:
          NODE_ENV: production
      - run: npm run build
        env:
          NODE_ENV: production

  ui:
    name: 화면 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:ui

  audit:
    name: 의존성 취약점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 배포되는 코드에 높음 이상 취약점이 있으면 실패
      - run: npm audit --omit=dev --audit-level=high
